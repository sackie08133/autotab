[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autotab"
version = "0.1.0"
description = "Local video-assisted guitar tablature with an editable, beat-based score"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
app = [
    "streamlit>=1.57,<2",
    "numpy>=1.26,<3",
    # Headless OpenCV avoids the libGL/X11 runtime dependency on Streamlit Cloud.
    "opencv-contrib-python-headless>=4.10,<5",
    "mediapipe>=0.10.32,<0.11",
    "imageio-ffmpeg>=0.6,<1",
    "pandas>=2.2,<4",
]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
autotab = "autotab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"autotab.ui" = ["calibration_component/*.html", "camera_component/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
